<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>极速拼图挑战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #87CEEB;
            overflow: hidden;
            height: 100vh;
        }

        .screen {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* 开始界面 */
        #start-screen {
            background: url('modifyImage/background.jpg') center/cover no-repeat;
        }

        .title {
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 3rem;
            text-align: center;
        }

        .btn {
            width: 200px;
            height: 60px;
            background: #FF6B6B;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 10px 0;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .btn-secondary {
            background: #4ECDC4;
        }

        /* 玩法说明界面 */
        #instructions-screen {
            background: rgba(135, 206, 235, 0.95);
            padding: 20px;
        }

        .instructions-content {
            background: #fff;
            border-radius: 20px;
            padding: 30px;
            max-width: 350px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .instructions-content h2 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .instructions-content ul {
            list-style: none;
            margin-bottom: 30px;
        }

        .instructions-content li {
            color: #666;
            margin: 15px 0;
            line-height: 1.6;
            padding-left: 25px;
            position: relative;
        }

        .instructions-content li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #4ECDC4;
            font-weight: bold;
        }

        /* 游戏界面 */
        #game-screen {
            background: #87CEEB;
            padding: 20px;
        }

        .game-header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .timer {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .timer.warning {
            color: #FF6B6B;
        }

        .puzzle-container {
            width: 350px;
            height: 350px;
            position: relative;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 10px;
            margin-bottom: 20px;
        }

        .puzzle-grid {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
        }

        .grid-cell {
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .puzzle-piece {
            position: absolute;
            width: calc(330px / 3);
            height: calc(330px / 3);
            border-radius: 8px;
            cursor: grab;
            transition: transform 0.1s ease;
            touch-action: none;
            background-size: 330px 330px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .puzzle-piece:active {
            cursor: grabbing;
            transform: scale(1.05);
            z-index: 100;
        }

        .puzzle-piece.placed {
            cursor: default;
            transform: scale(1);
            z-index: 1;
            box-shadow: none;
        }

        .game-controls {
            display: flex;
            gap: 20px;
        }

        /* 结果弹窗 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 300px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .modal-content h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .modal-content.success h2 {
            color: #4ECDC4;
        }

        .modal-content.failure h2 {
            color: #FF6B6B;
        }

        .modal-content p {
            color: #666;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <!-- 开始界面（包含玩法说明） -->
    <div id="start-screen" class="screen">
        <h1 class="title">极速拼图挑战</h1>
        <div class="instructions-content">
            <h2>玩法说明</h2>
            <ul>
                <li>游戏共有9块拼图碎片，需要在60秒内完成拼接</li>
                <li>用手指拖动拼图碎片到对应位置，正确则自动固定</li>
                <li>点击重置按钮可重新打乱拼图</li>
                <li>时间结束前完成所有拼图即为挑战成功</li>
            </ul>
        </div>
        <button class="btn" style="margin-top: 20px;" onclick="startGame()">开始游戏</button>
    </div>

    <!-- 游戏界面 -->
    <div id="game-screen" class="screen hidden">
        <div class="game-header">
            <div class="timer" id="timer">60</div>
        </div>
        
        <div class="puzzle-container">
            <div class="puzzle-grid" id="puzzle-grid">
                <div class="grid-cell" data-row="0" data-col="0"></div>
                <div class="grid-cell" data-row="0" data-col="1"></div>
                <div class="grid-cell" data-row="0" data-col="2"></div>
                <div class="grid-cell" data-row="1" data-col="0"></div>
                <div class="grid-cell" data-row="1" data-col="1"></div>
                <div class="grid-cell" data-row="1" data-col="2"></div>
                <div class="grid-cell" data-row="2" data-col="0"></div>
                <div class="grid-cell" data-row="2" data-col="1"></div>
                <div class="grid-cell" data-row="2" data-col="2"></div>
            </div>
        </div>

        <div class="game-controls">
            <button class="btn btn-secondary" onclick="resetGame()">重置</button>
        </div>
    </div>

    <!-- 成功弹窗 -->
    <div id="success-modal" class="modal">
        <div class="modal-content success">
            <h2>🎉 挑战成功</h2>
            <p>太棒了！你在规定时间内完成了拼图</p>
            <button class="btn" onclick="restartGame()">重新挑战</button>
        </div>
    </div>

    <!-- 失败弹窗 -->
    <div id="failure-modal" class="modal">
        <div class="modal-content failure">
            <h2>💔 挑战失败</h2>
            <p>时间到了，再试一次吧！</p>
            <button class="btn" onclick="restartGame()">重新挑战</button>
        </div>
    </div>

    <script>
        // 游戏配置
        const gameConfig = {
            puzzleSize: 3,
            timeLimit: 60,
            pieceSize: 330 / 3,
            snapThreshold: 20,
            imageUrl: 'modifyImage/puzzle_image.png'
        };

        // 游戏状态
        let gameState = {
            timeLeft: gameConfig.timeLimit,
            timer: null,
            pieces: [],
            placedCount: 0,
            isPlaying: false,
            activePiece: null,
            offsetX: 0,
            offsetY: 0
        };

        // 页面元素
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const timerElement = document.getElementById('timer');
        const puzzleGrid = document.getElementById('puzzle-grid');
        const successModal = document.getElementById('success-modal');
        const failureModal = document.getElementById('failure-modal');

        // 开始游戏
        function startGame() {
            startScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            initializeGame();
        }

        // 初始化游戏
        function initializeGame() {
            // 清空现有拼图
            const existingPieces = document.querySelectorAll('.puzzle-piece');
            existingPieces.forEach(piece => piece.remove());
            
            // 重置状态
            gameState.timeLeft = gameConfig.timeLimit;
            gameState.placedCount = 0;
            gameState.isPlaying = true;
            gameState.pieces = [];
            
            // 更新计时器
            updateTimer();
            
            // 生成拼图碎片
            generatePuzzlePieces();
            
            // 开始计时
            startTimer();
        }

        // 生成拼图碎片
        function generatePuzzlePieces() {
            const container = document.querySelector('.puzzle-container');
            const containerRect = container.getBoundingClientRect();
            
            // 创建所有碎片
            for (let row = 0; row < gameConfig.puzzleSize; row++) {
                for (let col = 0; col < gameConfig.puzzleSize; col++) {
                    const piece = document.createElement('div');
                    piece.className = 'puzzle-piece';
                    piece.dataset.correctRow = row;
                    piece.dataset.correctCol = col;
                    
                    // 设置背景图位置
                    const bgX = -col * gameConfig.pieceSize;
                    const bgY = -row * gameConfig.pieceSize;
                    piece.style.backgroundImage = `url(${gameConfig.imageUrl})`;
                    piece.style.backgroundPosition = `${bgX}px ${bgY}px`;
                    
                    // 随机位置
                    const randomX = Math.random() * (containerRect.width - gameConfig.pieceSize);
                    const randomY = Math.random() * (containerRect.height - gameConfig.pieceSize);
                    piece.style.left = `${randomX}px`;
                    piece.style.top = `${randomY}px`;
                    
                    // 添加事件监听
                    piece.addEventListener('mousedown', startDrag);
                    piece.addEventListener('touchstart', startDrag, { passive: false });
                    
                    container.appendChild(piece);
                    gameState.pieces.push(piece);
                }
            }
            
            // 打乱顺序
            shuffleArray(gameState.pieces);
        }

        // 开始拖拽
        function startDrag(e) {
            if (!gameState.isPlaying) return;
            
            e.preventDefault();
            
            const piece = e.target;
            if (piece.classList.contains('placed')) return;
            
            gameState.activePiece = piece;
            
            // 计算偏移量
            const rect = piece.getBoundingClientRect();
            const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
            
            gameState.offsetX = clientX - rect.left;
            gameState.offsetY = clientY - rect.top;
            
            // 添加全局事件
            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag, { passive: false });
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);
        }

        // 拖拽中
        function drag(e) {
            if (!gameState.activePiece || !gameState.isPlaying) return;
            
            e.preventDefault();
            
            const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
            
            const container = document.querySelector('.puzzle-container');
            const containerRect = container.getBoundingClientRect();
            
            let x = clientX - containerRect.left - gameState.offsetX;
            let y = clientY - containerRect.top - gameState.offsetY;
            
            // 限制在容器内
            x = Math.max(0, Math.min(x, containerRect.width - gameConfig.pieceSize));
            y = Math.max(0, Math.min(y, containerRect.height - gameConfig.pieceSize));
            
            gameState.activePiece.style.left = `${x}px`;
            gameState.activePiece.style.top = `${y}px`;
        }

        // 结束拖拽
        function endDrag() {
            if (!gameState.activePiece || !gameState.isPlaying) return;
            
            const piece = gameState.activePiece;
            const rect = piece.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            // 检查是否放到正确位置
            const cells = document.querySelectorAll('.grid-cell');
            let placed = false;
            
            for (const cell of cells) {
                const cellRect = cell.getBoundingClientRect();
                const cellRow = parseInt(cell.dataset.row);
                const cellCol = parseInt(cell.dataset.col);
                const correctRow = parseInt(piece.dataset.correctRow);
                const correctCol = parseInt(piece.dataset.correctCol);
                
                // 检查是否在单元格范围内且位置正确
                if (
                    centerX >= cellRect.left && centerX <= cellRect.right &&
                    centerY >= cellRect.top && centerY <= cellRect.bottom &&
                    cellRow === correctRow && cellCol === correctCol
                ) {
                    // 放置到正确位置
                    const container = document.querySelector('.puzzle-container');
                    const containerRect = container.getBoundingClientRect();
                    const cellX = cellRect.left - containerRect.left;
                    const cellY = cellRect.top - containerRect.top;
                    
                    piece.style.left = `${cellX}px`;
                    piece.style.top = `${cellY}px`;
                    piece.classList.add('placed');
                    piece.style.pointerEvents = 'none';
                    
                    gameState.placedCount++;
                    placed = true;
                    
                    // 检查是否完成
                    if (gameState.placedCount === gameState.pieces.length) {
                        gameWin();
                    }
                    
                    break;
                }
            }
            
            // 移除全局事件
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('touchmove', drag);
            document.removeEventListener('mouseup', endDrag);
            document.removeEventListener('touchend', endDrag);
            
            gameState.activePiece = null;
        }

        // 开始计时器
        function startTimer() {
            clearInterval(gameState.timer);
            gameState.timer = setInterval(() => {
                gameState.timeLeft--;
                updateTimer();
                
                if (gameState.timeLeft <= 0) {
                    gameOver();
                }
            }, 1000);
        }

        // 更新计时器显示
        function updateTimer() {
            timerElement.textContent = gameState.timeLeft;
            
            if (gameState.timeLeft <= 10) {
                timerElement.classList.add('warning');
            } else {
                timerElement.classList.remove('warning');
            }
        }

        // 游戏胜利
        function gameWin() {
            gameState.isPlaying = false;
            clearInterval(gameState.timer);
            successModal.classList.add('show');
        }

        // 游戏失败
        function gameOver() {
            gameState.isPlaying = false;
            clearInterval(gameState.timer);
            failureModal.classList.add('show');
        }

        // 重置游戏
        function resetGame() {
            clearInterval(gameState.timer);
            initializeGame();
        }

        // 重新开始
        function restartGame() {
            successModal.classList.remove('show');
            failureModal.classList.remove('show');
            // 返回首页而不是直接重置
            gameScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
        }

        // 数组洗牌
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // 防止页面缩放
        document.addEventListener('touchmove', function(e) {
            if (e.scale !== 1) {
                e.preventDefault();
            }
        }, { passive: false });

        // 预加载图片
        const img = new Image();
        img.src = gameConfig.imageUrl;
    </script>
</body>
</html>
