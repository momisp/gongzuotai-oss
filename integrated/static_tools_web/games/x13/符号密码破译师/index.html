<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>符号密码破译师</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

        :root {
            --neon: #39ff14;
            --neon-dim: rgba(57, 255, 20, 0.35);
            --neon-glow: rgba(57, 255, 20, 0.55);
            --magenta: #ff00ff;
            --magenta-dim: rgba(255, 0, 255, 0.4);
            --cyan: #00ffff;
            --bg-deep: #050510;
            --bg-panel: rgba(8, 12, 28, 0.88);
            --bg-card: rgba(0, 0, 0, 0.55);
            --danger: #ff2d55;
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --font-display: 'VT323', monospace;
            --font-ui: 'Share Tech Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-ui);
            background: var(--bg-deep);
            background-image:
                radial-gradient(ellipse 80% 60% at 50% 0%, rgba(57, 255, 20, 0.08) 0%, transparent 55%),
                radial-gradient(ellipse 60% 40% at 100% 100%, rgba(255, 0, 255, 0.06) 0%, transparent 50%),
                linear-gradient(180deg, #0a0a1a 0%, #050510 100%);
            color: var(--neon);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        #gameContainer {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            position: relative;
            overflow: hidden;
            border-radius: var(--radius-lg);
            border: 1px solid var(--neon-dim);
            box-shadow:
                0 0 0 1px rgba(57, 255, 20, 0.15),
                0 0 40px rgba(57, 255, 20, 0.15),
                0 24px 48px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(57, 255, 20, 0.2);
            background: var(--bg-deep);
        }

        #gameContainer::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: linear-gradient(135deg, var(--neon) 0%, transparent 40%, transparent 60%, var(--magenta) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 2;
            opacity: 0.6;
        }

        #gameContainer::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.12) 2px,
                rgba(0, 0, 0, 0.12) 4px
            );
            pointer-events: none;
            z-index: 999;
            opacity: 0.4;
        }

        #background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.45;
            filter: saturate(0.7) contrast(1.1);
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            background: linear-gradient(180deg, var(--bg-panel) 0%, rgba(5, 5, 16, 0.92) 100%);
            backdrop-filter: blur(4px);
            transition: opacity 0.4s ease, visibility 0.4s ease;
            z-index: 10;
        }

        #gameScreen.screen {
            justify-content: flex-start;
            padding: 0;
            gap: 0;
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* —— 开始界面 —— */
        .title-block {
            text-align: center;
            margin-bottom: 24px;
        }

        .title-tag {
            display: inline-block;
            font-family: var(--font-ui);
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            color: var(--cyan);
            text-transform: uppercase;
            padding: 6px 14px;
            margin-bottom: 12px;
            border: 1px solid rgba(0, 255, 255, 0.35);
            border-radius: 999px;
            background: rgba(0, 255, 255, 0.06);
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.15);
        }

        .glitch-text {
            font-family: var(--font-display);
            font-size: clamp(2.4rem, 8vw, 3.2rem);
            line-height: 1.1;
            text-align: center;
            text-shadow:
                0 0 8px var(--neon-glow),
                0 0 24px var(--neon-dim),
                2px 0 0 var(--magenta-dim);
            animation: glitch 3s ease-in-out infinite;
            letter-spacing: 0.05em;
        }

        @keyframes glitch {
            0%, 92%, 100% {
                text-shadow: 0 0 8px var(--neon-glow), 0 0 24px var(--neon-dim);
                transform: translate(0);
            }
            93% {
                text-shadow: 2px 0 var(--magenta), -2px 0 var(--cyan);
                transform: translate(-2px, 1px);
            }
            95% {
                text-shadow: -2px 0 var(--magenta), 2px 0 var(--cyan);
                transform: translate(2px, -1px);
            }
        }

        .description {
            width: 100%;
            max-width: 360px;
            font-size: 1.05rem;
            line-height: 1.75;
            margin-bottom: 28px;
            background: var(--bg-card);
            padding: 18px 20px;
            border: 1px solid var(--neon-dim);
            border-radius: var(--radius-md);
            box-shadow: inset 0 0 30px rgba(57, 255, 20, 0.04);
            position: relative;
        }

        .description::before,
        .description::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border-color: var(--neon);
            border-style: solid;
            opacity: 0.7;
        }

        .description::before {
            top: 8px;
            left: 8px;
            border-width: 2px 0 0 2px;
        }

        .description::after {
            bottom: 8px;
            right: 8px;
            border-width: 0 2px 2px 0;
        }

        .description p {
            margin-bottom: 8px;
            color: rgba(57, 255, 20, 0.92);
        }

        .description p:last-child {
            margin-bottom: 0;
        }

        .description .rule-highlight {
            color: var(--cyan);
        }

        .start-button {
            position: relative;
            width: min(280px, 90%);
            height: 72px;
            background: linear-gradient(180deg, rgba(26, 94, 36, 0.9) 0%, rgba(15, 52, 19, 0.95) 100%);
            border: 1px solid var(--neon);
            border-radius: var(--radius-md);
            color: var(--neon);
            font-family: var(--font-display);
            font-size: 2.2rem;
            letter-spacing: 0.08em;
            text-shadow: 0 0 12px var(--neon-glow);
            box-shadow:
                0 0 24px rgba(57, 255, 20, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                inset 0 -2px 8px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            overflow: hidden;
        }

        .start-button::before {
            content: '▶ ';
            opacity: 0.8;
        }

        .start-button::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(57, 255, 20, 0.15), transparent);
            transition: left 0.5s ease;
        }

        .start-button:hover {
            transform: translateY(-2px);
            border-color: #5fff3a;
            box-shadow:
                0 0 36px rgba(57, 255, 20, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .start-button:hover::after {
            left: 150%;
        }

        .start-button:active {
            transform: translateY(1px) scale(0.98);
        }

        /* —— 游戏顶栏 —— */
        .game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0.5) 100%);
            border-bottom: 1px solid var(--neon-dim);
            flex-shrink: 0;
            gap: 8px;
        }

        .stat-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--bg-card);
            border: 1px solid var(--neon-dim);
            border-radius: var(--radius-sm);
            min-width: 0;
        }

        .battery-display {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .battery-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: drop-shadow(0 0 6px var(--neon-glow));
        }

        .battery-bar-wrap {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .battery-bar {
            width: 48px;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid var(--neon-dim);
        }

        .battery-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon), #7fff6a);
            border-radius: 2px;
            transition: width 0.35s ease, background 0.35s ease;
            box-shadow: 0 0 8px var(--neon-glow);
        }

        .battery-bar-fill.low {
            background: linear-gradient(90deg, #ff6600, var(--danger));
            box-shadow: 0 0 8px rgba(255, 45, 85, 0.6);
        }

        .battery-text {
            font-family: var(--font-display);
            font-size: 1.35rem;
            line-height: 1;
            color: var(--neon);
        }

        .battery-label {
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            color: var(--neon-dim);
            text-transform: uppercase;
        }

        .level-display {
            font-family: var(--font-display);
            font-size: 1.4rem;
            color: var(--neon);
            text-align: center;
            padding: 6px 16px;
            background: var(--bg-card);
            border: 1px solid var(--neon-dim);
            border-radius: var(--radius-sm);
            white-space: nowrap;
        }

        .hint-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 4px 8px 4px 4px;
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .hint-wrap:hover {
            background: rgba(255, 0, 255, 0.08);
            border-color: var(--magenta-dim);
        }

        .hint-button {
            width: 40px;
            height: 40px;
            object-fit: contain;
            transition: transform 0.2s ease, filter 0.2s ease;
            filter: drop-shadow(0 0 6px var(--magenta-dim));
        }

        .hint-wrap:hover .hint-button {
            transform: scale(1.08);
            filter: drop-shadow(0 0 10px var(--magenta));
        }

        .hint-count {
            font-family: var(--font-display);
            font-size: 1.35rem;
            min-width: 1.2em;
            text-align: center;
            color: var(--magenta);
            text-shadow: 0 0 8px var(--magenta-dim);
        }

        .phase-indicator {
            width: calc(100% - 32px);
            margin: 16px auto 0;
            text-align: center;
            font-family: var(--font-display);
            font-size: 1.5rem;
            padding: 10px 16px;
            color: var(--neon);
            background: linear-gradient(90deg, transparent, rgba(57, 255, 20, 0.08), transparent);
            border-top: 1px solid var(--neon-dim);
            border-bottom: 1px solid var(--neon-dim);
            text-shadow: 0 0 12px var(--neon-dim);
            letter-spacing: 0.12em;
            flex-shrink: 0;
        }

        .phase-indicator::before {
            content: '// ';
            color: var(--cyan);
            opacity: 0.8;
        }

        .password-area {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px 16px 24px;
            overflow-y: auto;
        }

        .pattern-label {
            width: 100%;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            color: var(--neon-dim);
            text-transform: uppercase;
            margin-bottom: -12px;
            padding-left: 4px;
        }

        .pattern-display {
            width: 100%;
            background:
                linear-gradient(180deg, rgba(0, 0, 0, 0.7) 0%, rgba(0, 20, 8, 0.5) 100%);
            border: 1px solid var(--neon-dim);
            border-radius: var(--radius-md);
            padding: 28px 16px;
            font-family: var(--font-display);
            font-size: clamp(1.6rem, 6vw, 2.2rem);
            text-align: center;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.35em;
            word-spacing: 0.2em;
            box-shadow:
                inset 0 0 40px rgba(57, 255, 20, 0.06),
                0 4px 20px rgba(0, 0, 0, 0.4);
            position: relative;
            color: #b8ffb8;
            text-shadow: 0 0 10px var(--neon-dim);
        }

        .pattern-display::after {
            content: '_';
            position: absolute;
            right: 24px;
            bottom: 20px;
            font-size: 1.2rem;
            color: var(--neon);
            animation: blink 1s step-end infinite;
            opacity: 0.7;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .options-label {
            width: 100%;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            color: var(--neon-dim);
            text-transform: uppercase;
            text-align: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }

        .option-card {
            aspect-ratio: 1;
            background: linear-gradient(145deg, rgba(0, 0, 0, 0.65) 0%, rgba(10, 30, 15, 0.4) 100%);
            border: 1px solid var(--neon-dim);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-size: clamp(1.6rem, 5vw, 2rem);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
            position: relative;
            user-select: none;
        }

        .option-card::before {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 4px;
            border: 1px solid transparent;
            transition: border-color 0.15s ease;
        }

        .option-card:hover {
            transform: translateY(-3px);
            border-color: var(--neon);
            box-shadow: 0 6px 20px rgba(57, 255, 20, 0.2);
            background: linear-gradient(145deg, rgba(20, 60, 25, 0.5) 0%, rgba(0, 0, 0, 0.6) 100%);
        }

        .option-card:hover::before {
            border-color: rgba(57, 255, 20, 0.25);
        }

        .option-card:active {
            transform: translateY(0) scale(0.96);
        }

        .option-card.selected {
            border-color: var(--neon);
            background: rgba(57, 255, 20, 0.15);
            box-shadow: 0 0 24px var(--neon-glow), inset 0 0 16px rgba(57, 255, 20, 0.2);
            animation: correctPulse 0.5s ease;
        }

        @keyframes correctPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .option-card.error {
            animation: errorShake 0.45s ease;
            border-color: var(--danger);
            box-shadow: 0 0 20px rgba(255, 45, 85, 0.5);
            background: rgba(255, 45, 85, 0.12);
        }

        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .option-card.interference {
            border-color: var(--magenta);
            animation: interferenceGlow 1.5s ease-in-out infinite;
        }

        @keyframes interferenceGlow {
            0%, 100% {
                box-shadow: 0 0 8px var(--magenta-dim);
                border-color: var(--magenta);
            }
            50% {
                box-shadow: 0 0 20px rgba(255, 0, 255, 0.6);
                border-color: #ff66ff;
            }
        }

        /* —— 提示弹窗 —— */
        .hint-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .hint-popup {
            width: 100%;
            max-width: 340px;
            background: linear-gradient(180deg, rgba(20, 5, 30, 0.98) 0%, rgba(5, 5, 20, 0.98) 100%);
            border: 1px solid var(--magenta);
            border-radius: var(--radius-md);
            padding: 28px 24px 24px;
            text-align: center;
            box-shadow:
                0 0 40px var(--magenta-dim),
                inset 0 0 30px rgba(255, 0, 255, 0.05);
            animation: popupAppear 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .hint-popup::before {
            content: 'DECRYPT_HINT';
            position: absolute;
            top: 10px;
            left: 16px;
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            color: var(--magenta);
            opacity: 0.6;
        }

        @keyframes popupAppear {
            from { opacity: 0; transform: scale(0.9) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .hint-text {
            font-size: 1.1rem;
            line-height: 1.65;
            margin: 20px 0 24px;
            color: #ffb3ff;
            text-align: left;
        }

        .close-hint {
            width: 100%;
            background: linear-gradient(180deg, #ff33ff 0%, #cc00cc 100%);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            font-family: var(--font-display);
            font-size: 1.4rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 16px var(--magenta-dim);
        }

        .close-hint:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(255, 0, 255, 0.45);
        }

        /* —— 结算界面 —— */
        .end-panel {
            text-align: center;
            padding: 24px;
            max-width: 360px;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--neon-dim);
            border-radius: var(--radius-md);
            box-shadow: inset 0 0 40px rgba(57, 255, 20, 0.03);
        }

        .end-panel.danger-panel {
            border-color: rgba(255, 45, 85, 0.4);
            box-shadow: inset 0 0 40px rgba(255, 45, 85, 0.05);
        }

        .success-screen,
        .game-over-screen {
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .success-icon {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px var(--neon-glow));
            animation: successPulse 2s ease-in-out infinite;
        }

        @keyframes successPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px var(--neon-glow)); }
            50% { transform: scale(1.06); filter: drop-shadow(0 0 32px var(--neon-glow)); }
        }

        .success-text {
            font-family: var(--font-display);
            font-size: 2.2rem;
            margin-bottom: 12px;
            color: var(--neon);
            text-shadow: 0 0 20px var(--neon-glow);
        }

        .game-over-text {
            font-family: var(--font-display);
            font-size: 2.6rem;
            color: var(--danger);
            text-shadow: 0 0 24px rgba(255, 45, 85, 0.6);
            margin-bottom: 12px;
            animation: gameOverGlow 1.5s ease-in-out infinite;
        }

        @keyframes gameOverGlow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; text-shadow: 0 0 32px rgba(255, 45, 85, 0.8); }
        }

        .subtitle-text {
            font-size: 1.05rem;
            line-height: 1.6;
            color: rgba(57, 255, 20, 0.85);
            margin-bottom: 8px;
        }

        .danger-panel .subtitle-text {
            color: rgba(255, 150, 150, 0.9);
        }

        .restart-button {
            background: linear-gradient(180deg, var(--neon) 0%, #2dd10f 100%);
            color: #041004;
            border: none;
            padding: 14px 36px;
            font-family: var(--font-display);
            font-size: 1.5rem;
            letter-spacing: 0.08em;
            cursor: pointer;
            border-radius: var(--radius-sm);
            margin-top: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 20px var(--neon-dim);
        }

        .restart-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px var(--neon-glow);
        }

        .danger-panel .restart-button {
            background: linear-gradient(180deg, #ff5577 0%, var(--danger) 100%);
            color: #fff;
            box-shadow: 0 4px 20px rgba(255, 45, 85, 0.35);
        }

        .danger-panel .restart-button:hover {
            box-shadow: 0 6px 28px rgba(255, 45, 85, 0.5);
        }

        /* —— 背景特效 —— */
        .code-rain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
            opacity: 0.5;
        }

        .code-rain span {
            position: absolute;
            color: var(--neon);
            font-size: 1rem;
            font-family: var(--font-display);
            animation: fall linear infinite;
            opacity: 0.5;
            text-shadow: 0 0 6px var(--neon-dim);
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        .noise-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyBAMAAADsEZWCAAAAGFBMVEUAAAAdHR0dHR0dHR0dHR0dHR0dHR0dHR3W4i5iAAAACHRSTlMAAwMGDBkaGj8zQr4AAAA4SURBVHgBY2AAkwJjBmIMYwxhjDGGMMYYwwxjDFGMAYYwwxhjjDFGMAYYwxRjAGGMMUYwBhjDFGMAAD3SgO6oH8XzAAAAABJRU5ErkJggg==') repeat;
            opacity: 0.04;
            pointer-events: none;
            z-index: 1001;
            mix-blend-mode: overlay;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <img id="background" src="modifyImage/background.jpg" alt="背景">
        
        <div class="noise-overlay"></div>
        
        <div class="code-rain" id="codeRain"></div>
        
        <!-- 开始界面 -->
        <div id="startScreen" class="screen">
            <div class="title-block">
                <span class="title-tag">Terminal v2.0</span>
                <h1 class="glitch-text">符号密码破译师</h1>
            </div>
            <div class="description">
                <p>欢迎来到终端破译系统！</p>
                <p>根据符号规律破解密码锁。</p>
                <p>初始电量 <span class="rule-highlight">8</span> 点，答错或点干扰符号会扣电。</p>
                <p>每关可用 <span class="rule-highlight">2</span> 次破译提示。</p>
                <p>完成三个阶段即可成功入侵！</p>
            </div>
            <button class="start-button" id="startButton">开始破译</button>
        </div>
        
        <!-- 游戏界面 -->
        <div id="gameScreen" class="screen hidden">
            <div class="game-header">
                <div class="stat-pill battery-display">
                    <img src="modifyImage/battery_icon.png" alt="电量" class="battery-icon">
                    <div class="battery-bar-wrap">
                        <span class="battery-label">PWR</span>
                        <div class="battery-bar">
                            <div class="battery-bar-fill" id="batteryBarFill" style="width: 100%"></div>
                        </div>
                    </div>
                    <span class="battery-text" id="batteryText">8</span>
                </div>
                <div class="level-display">
                    <span id="levelText">关卡 1</span>
                </div>
                <div class="stat-pill hint-wrap" id="hintButton" role="button" tabindex="0" aria-label="破译提示">
                    <img src="modifyImage/hint_button.png" alt="" class="hint-button">
                    <span class="hint-count" id="hintCount">2</span>
                </div>
            </div>
            
            <div class="phase-indicator" id="phaseIndicator">初级终端</div>
            
            <div class="password-area">
                <div class="pattern-label">Signal Pattern</div>
                <div class="pattern-display" id="patternDisplay">
                    ▶ ■ ● ▶ ■ ?
                </div>
                <div class="options-label">Select Symbol</div>
                <div class="options-grid" id="optionsGrid">
                    <!-- 选项将由JS动态生成 -->
                </div>
            </div>
        </div>
        
        <!-- 成功界面 -->
        <div id="successScreen" class="screen hidden">
            <div class="success-screen">
                <div class="end-panel">
                    <img src="modifyImage/success_icon.png" alt="成功" class="success-icon">
                    <h2 class="success-text">终端破解成功！</h2>
                    <p class="subtitle-text">恭喜你完成所有阶段，成功入侵系统！</p>
                    <button class="restart-button" id="restartSuccess">重新挑战</button>
                </div>
            </div>
        </div>
        
        <!-- 游戏结束界面 -->
        <div id="gameOverScreen" class="screen hidden">
            <div class="game-over-screen">
                <div class="end-panel danger-panel">
                    <h2 class="game-over-text">电量耗尽</h2>
                    <p class="subtitle-text">终端已锁定，请重启系统。</p>
                    <button class="restart-button" id="restartGameOver">重启终端</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局游戏配置
        window.gameConfig = {
            initialBattery: 8,
            hintsPerLevel: 2,
            levelsPerPhase: 1,
            totalPhases: 3,
            phaseNames: ["初级终端", "核心服务器", "主机密室"],
            symbols: ["▶", "■", "●", "▲", "◆", "★", "⬢", "✦", "✧", "❖"],
            colors: ["#39ff14", "#ff00ff", "#00ffff", "#ffff00", "#ff6600", "#ff3399"],
            interferenceChance: 0.2
        };

        // 游戏状态
        let gameState = {
            currentLevel: 1,
            currentPhase: 0,
            battery: gameConfig.initialBattery,
            hintsRemaining: gameConfig.hintsPerLevel,
            completedLevels: 0,
            currentPattern: null,
            currentAnswer: null,
            gameOver: false
        };

        // DOM元素
        const startScreen = document.getElementById('startScreen');
        const gameScreen = document.getElementById('gameScreen');
        const successScreen = document.getElementById('successScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startButton = document.getElementById('startButton');
        const batteryText = document.getElementById('batteryText');
        const batteryBarFill = document.getElementById('batteryBarFill');
        const gameContainer = document.getElementById('gameContainer');
        const levelText = document.getElementById('levelText');
        const hintButton = document.getElementById('hintButton');
        const hintCount = document.getElementById('hintCount');
        const phaseIndicator = document.getElementById('phaseIndicator');
        const patternDisplay = document.getElementById('patternDisplay');
        const optionsGrid = document.getElementById('optionsGrid');
        const restartSuccess = document.getElementById('restartSuccess');
        const restartGameOver = document.getElementById('restartGameOver');
        const codeRain = document.getElementById('codeRain');

        function updateBatteryUI() {
            const max = gameConfig.initialBattery;
            const current = Math.max(0, gameState.battery);
            const pct = (current / max) * 100;
            batteryText.textContent = current;
            batteryBarFill.style.width = pct + '%';
            batteryBarFill.classList.toggle('low', current <= 3);
        }

        // 初始化代码雨效果
        function initCodeRain() {
            const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
            for (let i = 0; i < 50; i++) {
                const span = document.createElement('span');
                span.textContent = chars[Math.floor(Math.random() * chars.length)];
                span.style.left = Math.random() * 100 + '%';
                span.style.animationDuration = (Math.random() * 3 + 2) + 's';
                span.style.animationDelay = Math.random() * 5 + 's';
                codeRain.appendChild(span);
            }
        }

        // 生成关卡
        function generateLevel() {
            const difficulty = gameState.currentLevel;
            const symbols = gameConfig.symbols;
            
            // 根据难度生成不同类型的规律
            let pattern, answer, hint;
            
            if (difficulty <= 1) {
                // 关卡1：重复序列
                const sequenceLength = 3;
                const sequence = [];
                for (let i = 0; i < sequenceLength; i++) {
                    sequence.push(symbols[Math.floor(Math.random() * symbols.length)]);
                }
                pattern = [...sequence, ...sequence.slice(0, 2), '?'];
                answer = sequence[2];
                hint = `💡 提示：观察前三个符号 ${sequence[0]} ${sequence[1]} ${sequence[2]}，后面又出现了 ${sequence[0]} ${sequence[1]}，问号处应该填第三个重复的符号`;
            } else if (difficulty <= 2) {
                // 关卡2：递增序列
                const baseIndex = Math.floor(Math.random() * (symbols.length - 4));
                const step = 1;
                pattern = [
                    symbols[baseIndex],
                    symbols[baseIndex + step],
                    symbols[baseIndex + step * 2],
                    symbols[baseIndex + step * 3],
                    '?'
                ];
                answer = symbols[baseIndex + step * 4];
                hint = `💡 提示：符号按顺序排列，从 ${symbols[baseIndex]} 开始，每次往后取一个，下一个应该是 ${symbols[baseIndex + step * 4]}`;
            } else if (difficulty <= 3) {
                // 关卡3：递减序列
                const baseIndex = Math.floor(Math.random() * (symbols.length - 4)) + 4;
                const step = -1;
                pattern = [
                    symbols[baseIndex],
                    symbols[baseIndex + step],
                    symbols[baseIndex + step * 2],
                    symbols[baseIndex + step * 3],
                    '?'
                ];
                answer = symbols[baseIndex + step * 4];
                hint = `💡 提示：符号按倒序排列，从 ${symbols[baseIndex]} 开始，每次往前取一个，下一个应该是 ${symbols[baseIndex + step * 4]}`;
            } else if (difficulty <= 4) {
                // 关卡4：交替序列
                const seq1 = [symbols[0], symbols[2], symbols[4]];
                const seq2 = [symbols[1], symbols[3], symbols[5]];
                pattern = [seq1[0], seq2[0], seq1[1], seq2[1], seq1[2], '?'];
                answer = seq2[2];
                hint = `💡 提示：分为两组交替出现，奇数位是 ${seq1[0]} ${seq1[1]} ${seq1[2]}，偶数位是 ${seq2[0]} ${seq2[1]}，问号处是第六位，属于第二组`;
            } else {
                // 关卡5：循环序列
                const rotation = [symbols[0], symbols[1], symbols[2], symbols[0]];
                pattern = [...rotation.slice(0, 3), '?'];
                answer = rotation[3];
                hint = `💡 提示：三个符号循环出现 ${rotation[0]} → ${rotation[1]} → ${rotation[2]} → ?，下一个应该回到第一个符号`;
            }

            gameState.currentPattern = pattern;
            gameState.currentAnswer = answer;
            gameState.currentHint = hint;

            // 更新显示
            patternDisplay.textContent = pattern.join(' ');
            levelText.textContent = `关卡 ${gameState.currentLevel}`;
            phaseIndicator.textContent = gameConfig.phaseNames[gameState.currentPhase];
            updateBatteryUI();
            hintCount.textContent = gameState.hintsRemaining;

            // 生成选项
            generateOptions();
        }

        // 生成选项
        function generateOptions() {
            optionsGrid.innerHTML = '';
            const symbols = gameConfig.symbols;
            const options = [gameState.currentAnswer];
            
            // 生成错误选项
            while (options.length < 8) {
                const randomSymbol = symbols[Math.floor(Math.random() * symbols.length)];
                if (!options.includes(randomSymbol)) {
                    options.push(randomSymbol);
                }
            }
            
            // 随机打乱选项
            options.sort(() => Math.random() - 0.5);
            
            // 添加到网格
            options.forEach((symbol, index) => {
                const card = document.createElement('div');
                card.className = 'option-card';
                
                // 随机添加干扰符号
                if (Math.random() < gameConfig.interferenceChance && symbol !== gameState.currentAnswer) {
                    card.classList.add('interference');
                    card.dataset.isInterference = 'true';
                }
                
                card.textContent = symbol;
                card.addEventListener('click', () => handleOptionClick(symbol, card));
                optionsGrid.appendChild(card);
            });
        }

        // 处理选项点击
        function handleOptionClick(symbol, card) {
            if (gameState.gameOver) return;
            
            if (card.dataset.isInterference === 'true') {
                // 点击了干扰符号
                gameState.battery--;
                updateBatteryUI();
                card.classList.add('error');
                setTimeout(() => card.classList.remove('error'), 500);
                
                if (gameState.battery <= 0) {
                    endGame(false);
                }
                return;
            }
            
            if (symbol === gameState.currentAnswer) {
                // 正确
                card.classList.add('selected');
                setTimeout(() => {
                    gameState.completedLevels++;
                    
                    // 检查是否完成阶段
                    if (gameState.completedLevels % gameConfig.levelsPerPhase === 0) {
                        gameState.currentPhase++;
                        if (gameState.currentPhase >= gameConfig.totalPhases) {
                            endGame(true);
                            return;
                        }
                    }
                    
                    // 进入下一关
                    gameState.currentLevel++;
                    gameState.hintsRemaining = gameConfig.hintsPerLevel;
                    generateLevel();
                }, 500);
            } else {
                // 错误
                gameState.battery--;
                updateBatteryUI();
                card.classList.add('error');
                setTimeout(() => card.classList.remove('error'), 500);
                
                if (gameState.battery <= 0) {
                    endGame(false);
                }
            }
        }

        // 显示提示
        function showHint() {
            if (gameState.hintsRemaining <= 0 || gameState.gameOver) return;
            
            gameState.hintsRemaining--;
            hintCount.textContent = gameState.hintsRemaining;
            
            const overlay = document.createElement('div');
            overlay.className = 'hint-overlay';
            overlay.innerHTML = `
                <div class="hint-popup">
                    <div class="hint-text">${gameState.currentHint}</div>
                    <button type="button" class="close-hint">确定</button>
                </div>
            `;
            
            gameContainer.appendChild(overlay);
            
            const closeHint = () => overlay.remove();
            overlay.querySelector('.close-hint').addEventListener('click', closeHint);
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closeHint();
            });
        }

        // 结束游戏
        function endGame(success) {
            gameState.gameOver = true;
            
            if (success) {
                successScreen.classList.remove('hidden');
            } else {
                gameOverScreen.classList.remove('hidden');
            }
            
            gameScreen.classList.add('hidden');
        }

        // 重置游戏
        function resetGame() {
            gameState = {
                currentLevel: 1,
                currentPhase: 0,
                battery: gameConfig.initialBattery,
                hintsRemaining: gameConfig.hintsPerLevel,
                completedLevels: 0,
                currentPattern: null,
                currentAnswer: null,
                gameOver: false
            };
            
            successScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            
            generateLevel();
        }

        // 事件监听
        startButton.addEventListener('click', () => {
            startScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            generateLevel();
        });

        hintButton.addEventListener('click', showHint);
        hintButton.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                showHint();
            }
        });

        restartSuccess.addEventListener('click', resetGame);
        restartGameOver.addEventListener('click', resetGame);

        // 初始化
        initCodeRain();
    </script>
</body>
</html>
