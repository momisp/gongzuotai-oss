<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>运维监控指标</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
      font-size: 13px;
      color: #1e293b;
      background: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
      background: #fff;
    }
    h1 { margin: 0 0 8px; font-size: 14px; }
    .hint {
      margin: 0;
      font-size: 11px;
      color: #64748b;
      line-height: 1.45;
    }
    nav {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .metric-row {
      display: flex;
      align-items: stretch;
      gap: 0;
      border-left: 3px solid transparent;
    }
    .metric-row.active {
      background: #fee2e2;
      border-left-color: #dc2626;
    }
    .metric-row button.link {
      flex: 1;
      min-width: 0;
      text-align: left;
      padding: 12px 10px 12px 14px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: inherit;
    }
    .metric-row.active button.link {
      font-weight: 600;
    }
    .metric-row button.link:hover { background: rgba(241, 245, 249, 0.8); }
    .metric-row.active button.link:hover { background: rgba(254, 226, 226, 0.85); }
    .remark-btn {
      flex-shrink: 0;
      align-self: center;
      padding: 6px 10px;
      margin-right: 8px;
      font-size: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      background: #fff;
      color: #475569;
      cursor: pointer;
    }
    .remark-btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
    .remark-btn.has-note {
      background: #fff7ed;
      border-color: #fdba74;
      color: #c2410c;
    }
    footer {
      padding: 10px 12px;
      border-top: 1px solid #e2e8f0;
      background: #fff;
      font-size: 11px;
      color: #64748b;
    }
    footer code { font-size: 10px; }
    .remark-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .remark-backdrop[hidden] { display: none !important; }
    .remark-dialog {
      width: 100%;
      max-width: 360px;
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }
    .remark-dialog h3 {
      margin: 0 0 10px;
      font-size: 14px;
    }
    .remark-dialog textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      padding: 10px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
    }
    .remark-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }
    .remark-actions button {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #e2e8f0;
      background: #fff;
    }
    .remark-actions button.primary {
      background: #dc2626;
      color: #fff;
      border-color: #dc2626;
    }
  </style>
</head>
<body>
  <header>
    <h1>运维监控指标</h1>
    <p class="hint">点击在<strong>独立大窗口</strong>顶层打开控制台（等同浏览器直接打开，不受 iframe 限制）。可并排摆放侧栏窗与面板窗。右侧 <strong>备注</strong> 可填写本机备忘（保存在应用数据目录）。</p>
  </header>
  <nav id="nav" aria-label="指标"></nav>
  <footer>指标来自 <code>metrics.json</code> · 备注存 <code>metric-remarks.json</code>（用户目录）</footer>

  <div id="remarkBackdrop" class="remark-backdrop" hidden>
    <div class="remark-dialog" role="dialog" aria-modal="true" aria-labelledby="remarkDialogTitle">
      <h3 id="remarkDialogTitle">指标备注</h3>
      <textarea id="remarkText" placeholder="填写该指标的备注，如待办、注意事项…"></textarea>
      <div class="remark-actions">
        <button type="button" id="remarkCancel">取消</button>
        <button type="button" class="primary" id="remarkSave">保存</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
