<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>正在连接服务…</title>
  <style>
    :root {
      --primary: #1890ff;
      --primary-hover: #40a9ff;
      --text: #1a1a1a;
      --text-secondary: #666;
      --border: #e0e0e0;
      --bg-page: #f5f7fa;
      --bg-card: #fff;
      --radius: 12px;
      --shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC",
        "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg-page);
    }
    button {
      font: inherit;
    }
    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 48px 20px 40px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: var(--shadow);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.2rem;
      font-weight: 700;
    }
    .status {
      margin: 0 0 20px;
      font-size: 0.88rem;
      color: var(--text-secondary);
      min-height: 1.4em;
    }
    .bar-track {
      height: 10px;
      border-radius: 999px;
      background: #e8e8e8;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), #69c0ff);
      transition: width 0.25s ease-out;
    }
    .fail {
      margin-top: 16px;
      padding: 12px;
      border-radius: var(--radius);
      border: 1px solid #ffccc7;
      background: #fff2f0;
      font-size: 0.85rem;
      color: #434343;
      display: none;
    }
    .fail.show {
      display: block;
    }
    .actions {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      cursor: pointer;
      font-weight: 500;
    }
    .btn:hover {
      border-color: #bbb;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .back {
      margin-top: 20px;
      text-align: center;
      font-size: 0.85rem;
    }
    .back a {
      color: var(--text-secondary);
      text-decoration: none;
    }
    .back a:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1>正在连接本地服务</h1>
      <p class="status" id="status">检测 <code>/api/health</code> …</p>
      <div class="bar-track" aria-hidden="true">
        <div class="bar-fill" id="bar"></div>
      </div>
      <div class="fail" id="fail">
        长时间未连接到本机服务。请在新窗口中双击运行 <code>启动充值模拟.bat</code>，或在项目目录执行 <code>npm start</code> 后点击下方重试。
      </div>
      <div class="actions" id="actions" style="display: none;">
        <button type="button" class="btn btn-primary" id="retry">重试检测</button>
        <button type="button" class="btn" id="gate">返回入口页</button>
      </div>
    </div>
    <p class="back"><a href="/">← 返回入口页</a></p>
  </div>
  <script>
    var statusEl = document.getElementById("status");
    var barEl = document.getElementById("bar");
    var failEl = document.getElementById("fail");
    var actionsEl = document.getElementById("actions");
    var pollTimer = null;
    var fakeTimer = null;
    var attempts = 0;
    var maxAttempts = 80;

    function setBar(pct) {
      barEl.style.width = Math.min(100, Math.max(0, pct)) + "%";
    }

    function clearTimers() {
      if (pollTimer) clearInterval(pollTimer);
      if (fakeTimer) clearInterval(fakeTimer);
      pollTimer = null;
      fakeTimer = null;
    }

    function goSimulate() {
      clearTimers();
      setBar(100);
      statusEl.textContent = "服务已就绪，正在进入充值页…";
      setTimeout(function () {
        window.location.replace("/simulate");
      }, 350);
    }

    function showFail() {
      clearTimers();
      failEl.classList.add("show");
      actionsEl.style.display = "flex";
      statusEl.textContent = "未检测到服务";
    }

    function tickFake() {
      attempts++;
      var cap = 88;
      var wave = cap * (1 - Math.exp(-attempts / 25));
      setBar(wave);
    }

    function pollOnce() {
      return fetch("/api/health", { cache: "no-store" })
        .then(function (r) {
          if (r.ok) return r.json();
          throw new Error("bad status");
        })
        .then(function (j) {
          if (j && j.ok) goSimulate();
        })
        .catch(function () {});
    }

    function start() {
      clearTimers();
      attempts = 0;
      failEl.classList.remove("show");
      actionsEl.style.display = "none";
      setBar(4);
      statusEl.textContent = "正在连接本机 http://127.0.0.1 …";
      fakeTimer = setInterval(tickFake, 400);
      var n = 0;
      pollTimer = setInterval(function () {
        n++;
        pollOnce();
        if (n >= maxAttempts) showFail();
      }, 400);
      pollOnce();
    }

    document.getElementById("retry").addEventListener("click", start);
    document.getElementById("gate").addEventListener("click", function () {
      window.location.href = "/";
    });

    start();
  </script>
</body>
</html>
